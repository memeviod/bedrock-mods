<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15121f">
<link rel="manifest" href="/manifest.json">
<title>Bedrock Mods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --night: #15121f; --slate: #221d33; --edge: #3a3157;
  --amethyst: #b48cff; --amethyst-deep: #6d4bc4; --ink: #efeaff; --mute: #a59fc0;
  --pixel: "Silkscreen", ui-monospace, monospace;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body {
  margin: 0; color: var(--ink); font: 16px/1.45 var(--body);
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
header {
  position: sticky; top: 0; z-index: 5; background: var(--night);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; border-bottom: 2px solid var(--edge);
}
h1 { margin: 0 0 10px; font: 700 22px/1 var(--pixel); letter-spacing: .02em; }
h1 span { color: var(--amethyst); }
.search {
  width: 100%; padding: 13px 14px; font: 16px var(--body); color: var(--ink);
  background: var(--slate); border: 2px solid var(--edge); border-radius: 4px;
}
.search::placeholder { color: var(--mute); }
.search:focus, .chip:focus-visible, .dl:focus-visible, .more:focus-visible { outline: 3px solid var(--amethyst); outline-offset: 2px; }
.chips { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
.chip {
  flex: none; padding: 8px 14px; font: 14px var(--body); color: var(--mute);
  background: transparent; border: 2px solid var(--edge); border-radius: 4px; cursor: pointer;
}
.chip[aria-pressed="true"] { color: var(--night); background: var(--amethyst); border-color: var(--amethyst); font-weight: 700; }
main { padding: 16px; max-width: 960px; margin: 0 auto; }
#list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card {
  display: grid; grid-template-columns: 72px 1fr; gap: 6px 12px; padding: 12px;
  background: var(--slate); border: 2px solid var(--edge); border-radius: 4px;
}
.card img, .ph { width: 72px; height: 72px; border-radius: 4px; background: var(--night); object-fit: cover; image-rendering: pixelated; grid-row: span 2; }
.card h2 { margin: 0; font-size: 17px; line-height: 1.2; overflow-wrap: anywhere; }
.by { margin: 2px 0 0; color: var(--mute); font-size: 13px; }
.sum { grid-column: 1 / -1; margin: 4px 0 0; color: var(--ink); opacity: .85; font-size: 14px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.count { color: var(--mute); font-size: 13px; }
.dl, .more {
  display: inline-block; padding: 10px 18px; font: 700 15px var(--body); text-decoration: none; text-align: center;
  color: var(--night); background: var(--amethyst); border: 0; border-radius: 4px; cursor: pointer;
  box-shadow: 0 4px 0 var(--amethyst-deep);
}
.dl:active, .more:active { transform: translateY(4px); box-shadow: 0 0 0 var(--amethyst-deep); }
.dl.ext { color: var(--ink); background: var(--edge); box-shadow: 0 4px 0 #261f3d; }
.status { padding: 28px 8px; text-align: center; color: var(--mute); }
.more { display: block; margin: 20px auto 8px; }
footer { padding: 12px 16px 28px; text-align: center; color: var(--mute); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>bedrock<span>mods</span></h1>
  <input id="q" class="search" type="search" placeholder="Busca un addon, mapa o textura" enterkeyhint="search" autocomplete="off" aria-label="Buscar addons">
  <div class="chips" role="group" aria-label="Ordenar">
    <button class="chip" data-sort="popular" aria-pressed="true">Populares</button>
    <button class="chip" data-sort="recent" aria-pressed="false">Recientes</button>
    <button class="chip" data-sort="downloads" aria-pressed="false">Más descargados</button>
  </div>
</header>
<main>
  <div id="list"></div>
  <div id="status" class="status"></div>
  <button id="more" class="more" hidden>Cargar más</button>
</main>
<footer>Al terminar la descarga, abre el archivo y Minecraft lo importa solo.<br>Addons y datos de CurseForge. Cada addon pertenece a su autor.</footer>
<script>
const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat('es', { notation: 'compact' });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let state = { q: '', sort: 'popular', page: 0 }, timer;

function card(m) {
  const img = m.icon ? `<img src="${esc(m.icon)}" alt="" loading="lazy">` : '<div class="ph"></div>';
  const link = `/api/download?mod=${m.id}&file=${m.fileId}`;
  const btn = m.fileId
    ? `<a class="dl${m.direct ? '' : ' ext'}" href="${link}" data-direct="${m.direct}">${m.direct ? 'Descargar' : 'Ver en CurseForge'}</a>`
    : '';
  return `<article class="card">${img}
    <div><h2>${esc(m.name)}</h2><p class="by">por ${esc(m.author || 'autor desconocido')}</p></div>
    <p class="sum">${esc(m.summary)}</p>
    <div class="foot"><span class="count">${nf.format(m.downloads || 0)} descargas</span>${btn}</div></article>`;
}

async function load(reset) {
  if (reset) { state.page = 0; $('#list').innerHTML = ''; }
  $('#more').hidden = true;
  $('#status').textContent = 'Buscando…';
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(state.q)}&sort=${state.sort}&page=${state.page}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error desconocido');
    $('#list').insertAdjacentHTML('beforeend', d.mods.map(card).join(''));
    $('#status').textContent = $('#list').children.length ? '' : 'No hay addons con ese nombre. Prueba con otra palabra.';
    $('#more').hidden = !d.more;
  } catch (e) {
    $('#status').textContent = 'No se pudo cargar: ' + e.message;
  }
}

$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value.trim(); load(true); }, 350);
});
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  state.sort = b.dataset.sort; load(true);
}));
$('#more').addEventListener('click', () => { state.page++; load(false); });
$('#list').addEventListener('click', e => {
  const a = e.target.closest('.dl');
  if (!a || a.dataset.direct !== 'true') return;
  const old = a.textContent; a.textContent = 'Descargando…';
  setTimeout(() => { a.textContent = old; }, 4000);
});
load(true);
</script>
</body>
</html>
